<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quét Bàn Giao Đơn Hàng</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f5f4f0; --surface:#ffffff; --surface2:#f8f7f4;
  --border:#e8e6df; --border2:#d4d1c7;
  --text:#1a1917; --text2:#6b6860; --text3:#9b9890;
  --accent:#1a56db; --accent-bg:#eff4ff; --accent-text:#1a56db;
  --success:#057a55; --success-bg:#f3faf7;
  --warning:#c27803; --warning-bg:#fdf6b2;
  --danger:#e02424; --danger-bg:#fdf2f2;
  --font:'Be Vietnam Pro',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --radius:8px; --radius-lg:12px;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}

/* HEADER */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.logo{display:flex;align-items:center;gap:12px;}
.logo-icon{width:38px;height:38px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.logo-title{font-size:16px;font-weight:700;color:var(--text);}
.logo-sub{font-size:11px;color:var(--text3);margin-top:1px;}
.clock-wrap{text-align:right;}
#clockTime{font-size:20px;font-weight:700;color:var(--accent);font-family:var(--mono);}
#clockDate{font-size:11px;color:var(--text3);margin-top:2px;}

/* TOAST */
#toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:var(--radius);font-size:13px;font-weight:500;opacity:0;transform:translateY(-8px);transition:all .3s;z-index:9999;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.12);}
#toast.show{opacity:1;transform:translateY(0);}
#toast.success{background:var(--success-bg);border:1px solid #a7f3d0;color:var(--success);}
#toast.error{background:var(--danger-bg);border:1px solid #fca5a5;color:var(--danger);}
#toast.warning{background:var(--warning-bg);border:1px solid #fde68a;color:var(--warning);}

/* WRAP */
.main-wrap{max-width:900px;margin:0 auto;padding:24px 20px;}

/* SESSION BAR */
.session-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;margin-bottom:16px;font-size:12px;color:var(--text2);display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.session-bar strong{color:var(--accent);font-weight:600;}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px;}
.card h2{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:14px;display:flex;align-items:center;gap:6px;}

/* FORM */
.form-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.form-group label{display:block;font-size:11px;font-weight:500;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}
.form-group input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;font-size:13px;font-family:var(--font);color:var(--text);outline:none;transition:border .2s;}
.form-group input:focus{border-color:var(--accent);background:#fff;}

/* STATS */
.stats-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 18px;text-align:center;}
.stat-num{font-size:30px;font-weight:700;line-height:1;margin-bottom:4px;}
.stat-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;}
.stat-total .stat-num{color:var(--accent);}
.stat-ok .stat-num{color:var(--success);}
.stat-dup .stat-num{color:var(--warning);}

/* SCAN BOX */
.scan-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:16px;transition:border-color .2s;}
.scan-card.active-scan{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,86,219,.08);}
.scan-card h2{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px;}
.input-row{display:flex;gap:10px;}
#scanInput{flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius);padding:12px 16px;font-size:16px;color:var(--text);font-family:var(--mono);outline:none;transition:all .2s;}
#scanInput:focus{border-color:var(--accent);background:#fff;}
#scanInput::placeholder{color:var(--text3);font-size:13px;font-family:var(--font);}
.btn-scan{background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:var(--font);transition:all .2s;}
.btn-scan:hover{background:#1648c0;transform:translateY(-1px);}

/* TABLE */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:16px;}
.table-header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.table-header h2{font-size:13px;font-weight:600;color:var(--text);}
.search-input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:7px 12px;font-size:12px;color:var(--text);outline:none;width:180px;font-family:var(--font);}
.search-input:focus{border-color:var(--accent);}
.scroll-area{max-height:340px;overflow-y:auto;}
.scroll-area::-webkit-scrollbar{width:5px;}
.scroll-area::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
table{width:100%;border-collapse:collapse;}
thead th{background:var(--surface2);padding:10px 16px;text-align:left;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);position:sticky;top:0;}
tbody tr{border-bottom:1px solid var(--border);transition:background .12s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--surface2);}
td{padding:10px 16px;font-size:13px;}
td.stt{color:var(--text3);width:50px;}
td.code{font-family:var(--mono);font-weight:600;color:var(--accent-text);font-size:14px;}
td.time-cell{color:var(--text2);font-size:12px;}
.del-btn{background:none;border:none;color:var(--border2);cursor:pointer;padding:4px 8px;border-radius:6px;font-size:14px;transition:all .2s;}
.del-btn:hover{background:var(--danger-bg);color:var(--danger);}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3);}
.empty-state .big{font-size:40px;margin-bottom:10px;}

/* ACTIONS */
.action-row{display:flex;gap:12px;}
.btn-export{background:var(--success);color:#fff;border:none;border-radius:var(--radius);flex:1;padding:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-export:hover{background:#046c4e;transform:translateY(-1px);}
.btn-export:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-clear{background:var(--surface);border:1.5px solid var(--danger);color:var(--danger);border-radius:var(--radius);padding:14px 20px;font-size:14px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all .2s;display:flex;align-items:center;gap:6px;}
.btn-clear:hover{background:var(--danger-bg);}

/* Highlight trùng */
tr.dup-flash{background:#fef9c3 !important;transition:background 1s;}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📦</div>
    <div>
      <div class="logo-title">Quét Bàn Giao Đơn Hàng</div>
      <div class="logo-sub">Không trùng lặp mã vận đơn</div>
    </div>
  </div>
  <div class="clock-wrap">
    <div id="clockTime">--:--:--</div>
    <div id="clockDate"></div>
  </div>
</header>

<div id="toast"></div>

<div class="main-wrap">

  <div class="session-bar">
    📋 Phiên làm việc: <strong id="sessionId">--</strong>
    &nbsp;|&nbsp; Bắt đầu: <strong id="sessionStart">--</strong>
    &nbsp;|&nbsp; Nhân viên: <strong id="sessionUser">--</strong>
  </div>

  <div class="card">
    <h2>👤 Thông tin bàn giao</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Tên nhân viên / Shipper</label>
        <input type="text" id="staffName" placeholder="Nguyễn Văn A" oninput="updateSession()">
      </div>
      <div class="form-group">
        <label>Mã nhân viên</label>
        <input type="text" id="staffCode" placeholder="NV001">
      </div>
      <div class="form-group">
        <label>Tuyến / Khu vực</label>
        <input type="text" id="routeName" placeholder="Tuyến HN-01">
      </div>
      <div class="form-group">
        <label>Ghi chú</label>
        <input type="text" id="noteField" placeholder="Ghi chú thêm...">
      </div>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-card stat-total"><div class="stat-num" id="totalCount">0</div><div class="stat-lbl">Tổng vận đơn</div></div>
    <div class="stat-card stat-ok"><div class="stat-num" id="okCount">0</div><div class="stat-lbl">Hợp lệ</div></div>
    <div class="stat-card stat-dup"><div class="stat-num" id="dupCount">0</div><div class="stat-lbl">Trùng (bỏ qua)</div></div>
  </div>

  <div class="scan-card" id="scanBox">
    <h2>🔍 Quét mã vận đơn</h2>
    <div class="input-row">
      <input type="text" id="scanInput"
        placeholder="Dùng súng quét hoặc nhập mã vận đơn rồi nhấn Enter..."
        autofocus
        onkeydown="handleKey(event)"
        onfocus="document.getElementById('scanBox').classList.add('active-scan')"
        onblur="document.getElementById('scanBox').classList.remove('active-scan')">
      <button class="btn-scan" onclick="doScan()">+ Quét</button>
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-header">
      <h2>📋 Danh sách vận đơn đã quét</h2>
      <input class="search-input" type="text" id="searchBox" placeholder="Tìm mã..." oninput="renderTable()">
    </div>
    <div class="scroll-area">
      <table>
        <thead>
          <tr><th>STT</th><th>Mã vận đơn</th><th>Giờ quét</th><th>Ngày</th><th></th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div id="emptyState" class="empty-state">
        <div class="big">📭</div>
        <div>Chưa có vận đơn nào. Bắt đầu quét!</div>
      </div>
    </div>
  </div>

  <div class="action-row">
    <button class="btn-export" id="exportBtn" onclick="exportPDF()" disabled>
      📄 Xuất biên bản PDF
    </button>
    <button class="btn-clear" onclick="clearAll()">🗑 Xoá tất cả</button>
  </div>

</div>

<script>
var orders = [];
var dupTotal = 0;
var sessionId = 'BG-' + Date.now().toString(36).toUpperCase();
var sessionStart = new Date();

// Clock
function tickClock(){
  var now = new Date();
  var days = ['CN','T2','T3','T4','T5','T6','T7'];
  document.getElementById('clockTime').textContent =
    pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
  document.getElementById('clockDate').textContent =
    days[now.getDay()]+' '+pad(now.getDate())+'/'+pad(now.getMonth()+1)+'/'+now.getFullYear();
}
function pad(n){ return String(n).padStart(2,'0'); }
setInterval(tickClock,1000); tickClock();

// Session
document.getElementById('sessionId').textContent = sessionId;
document.getElementById('sessionStart').textContent =
  pad(sessionStart.getHours())+':'+pad(sessionStart.getMinutes())+' '+pad(sessionStart.getDate())+'/'+pad(sessionStart.getMonth()+1);

function updateSession(){
  var v = document.getElementById('staffName').value || '--';
  document.getElementById('sessionUser').textContent = v;
}

// Toast
function showToast(msg, type){
  var el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show ' + type;
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.className = ''; }, 2800);
}

// Scan
function handleKey(e){ if(e.key==='Enter') doScan(); }

function doScan(){
  var input = document.getElementById('scanInput');
  var code = input.value.trim().toUpperCase();
  input.value = ''; input.focus();
  if(!code){ showToast('Vui lòng nhập mã vận đơn!','error'); return; }

  // Kiểm tra trùng
  if(orders.some(function(o){ return o.code===code; })){
    dupTotal++;
    document.getElementById('dupCount').textContent = dupTotal;
    showToast('⚠ TRÙNG MÃ: "'+code+'" — Đã bỏ qua!','warning');
    // Flash highlight hàng trùng
    var rows = document.querySelectorAll('tbody tr');
    for(var i=0;i<rows.length;i++){
      if(rows[i].getAttribute('data-code')===code){
        rows[i].classList.add('dup-flash');
        (function(r){ setTimeout(function(){ r.classList.remove('dup-flash'); },1200); })(rows[i]);
      }
    }
    return;
  }

  var now = new Date();
  orders.unshift({ code:code, time:pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds()), date:pad(now.getDate())+'/'+pad(now.getMonth()+1)+'/'+now.getFullYear(), ts:now, stt:0 });
  for(var j=0;j<orders.length;j++) orders[j].stt = orders.length-j;
  document.getElementById('totalCount').textContent = orders.length;
  document.getElementById('okCount').textContent = orders.length;
  document.getElementById('exportBtn').disabled = false;
  renderTable();
  showToast('✓ Đã thêm: '+code,'success');
}

function renderTable(){
  var q = document.getElementById('searchBox').value.trim().toUpperCase();
  var filtered = q ? orders.filter(function(o){ return o.code.indexOf(q)>=0; }) : orders;
  var emptyEl = document.getElementById('emptyState');
  var tbody = document.getElementById('tableBody');
  if(filtered.length===0){ tbody.innerHTML=''; emptyEl.style.display='block'; return; }
  emptyEl.style.display='none';
  var html='';
  for(var i=0;i<filtered.length;i++){
    var o=filtered[i];
    html+='<tr data-code="'+o.code+'"><td class="stt">'+o.stt+'</td><td class="code">'+o.code+'</td><td class="time-cell">'+o.time+'</td><td class="time-cell">'+o.date+'</td><td><button class="del-btn" onclick="deleteOrder(\''+o.code+'\')">🗑</button></td></tr>';
  }
  tbody.innerHTML=html;
}

function deleteOrder(code){
  if(!confirm('Xoá vận đơn '+code+'?')) return;
  orders=orders.filter(function(o){ return o.code!==code; });
  for(var j=0;j<orders.length;j++) orders[j].stt=orders.length-j;
  document.getElementById('totalCount').textContent=orders.length;
  document.getElementById('okCount').textContent=orders.length;
  if(orders.length===0) document.getElementById('exportBtn').disabled=true;
  renderTable();
  showToast('Đã xoá: '+code,'warning');
}

function clearAll(){
  if(orders.length===0) return;
  if(!confirm('Xoá toàn bộ '+orders.length+' vận đơn?')) return;
  orders=[]; dupTotal=0;
  ['totalCount','okCount','dupCount'].forEach(function(id){ document.getElementById(id).textContent=0; });
  document.getElementById('exportBtn').disabled=true;
  renderTable();
  showToast('Đã xoá toàn bộ dữ liệu','warning');
}


function ra(s){
  if(!s) return '';
  return s.normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/\u0111/g,'d').replace(/\u0110/g,'D')
    .replace(/[^\x00-\x7F]/g,'?');
}

function exportPDF(){
  if(orders.length===0){ showToast('Khong co du lieu!','error'); return; }
  showToast('Dang tao PDF...','success');
  setTimeout(function(){
    try { _doPDF(); } catch(e){ showToast('Loi: '+e.message,'error'); console.error(e); }
  }, 100);
}

function _doPDF(){
  var staff     = document.getElementById('staffName').value  || 'Chua nhap';
  var staffCode = document.getElementById('staffCode').value  || '--';
  var route     = document.getElementById('routeName').value  || '--';
  var note      = document.getElementById('noteField').value  || '';
  var now       = new Date();
  var dateStr   = pad(now.getDate())+'/'+pad(now.getMonth()+1)+'/'+now.getFullYear();
  var timeStr   = pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
  var startStr  = pad(sessionStart.getHours())+':'+pad(sessionStart.getMinutes())+' '+pad(sessionStart.getDate())+'/'+pad(sessionStart.getMonth()+1);
  var sorted    = orders.slice().sort(function(a,b){ return a.ts-b.ts; });

  var SCALE=3, PW=794*SCALE, ROW_H=26*SCALE, HEADER_H=290*SCALE, SIG_H=110*SCALE, FOOTER_H=30*SCALE;
  var rowsPerPage = Math.floor((1123*SCALE-HEADER_H-SIG_H-FOOTER_H)/ROW_H);
  if(rowsPerPage<1) rowsPerPage=1;
  var pages=[], totalPages=Math.max(1,Math.ceil(sorted.length/rowsPerPage));
  for(var p=0;p<totalPages;p++) pages.push(sorted.slice(p*rowsPerPage,(p+1)*rowsPerPage));

  var canvases=[];
  for(var pg=0;pg<pages.length;pg++){
    var rows=pages[pg];
    var PH=HEADER_H+rows.length*ROW_H+SIG_H+FOOTER_H;
    var cv=document.createElement('canvas');
    cv.width=PW; cv.height=Math.max(PH,400*SCALE);
    var cx=cv.getContext('2d');

    // White bg
    cx.fillStyle='#fff'; cx.fillRect(0,0,PW,cv.height);

    // Header
    var S=SCALE;
    cx.fillStyle='#1a56db'; cx.fillRect(0,0,PW,88*S);
    cx.fillStyle='#fff'; cx.textAlign='center';
    cx.font='bold '+(24*S)+'px Arial'; cx.fillText('BIEN BAN BAN GIAO DON HANG',PW/2,34*S);
    cx.font=(12*S)+'px Arial'; cx.fillStyle='rgba(200,212,255,1)';
    cx.fillText('Ma phien: '+sessionId+'   |   Xuat: '+timeStr+' ngay '+dateStr,PW/2,54*S);
    cx.font='bold '+(14*S)+'px Arial'; cx.fillStyle='#fff';
    cx.fillText('Tong: '+orders.length+' don   |   Trang '+(pg+1)+'/'+totalPages,PW/2,76*S);

    // Info box
    cx.fillStyle='#eff4ff'; cx.strokeStyle='#1a56db'; cx.lineWidth=1.5*S;
    cx.beginPath(); cx.roundRect(18*S,96*S,(PW-36*S),76*S,8*S); cx.fill(); cx.stroke();
    cx.font='bold '+(11*S)+'px Arial'; cx.fillStyle='#1a56db'; cx.textAlign='left';
    cx.fillText('THONG TIN BAN GIAO',28*S,115*S);
    var rows2=[
      ['Nhan vien:',ra(staff),28*S,132*S], ['Ma NV:',ra(staffCode),PW/2,132*S],
      ['Tuyen/KV:',ra(route),28*S,150*S],  ['Bat dau:',startStr,PW/2,150*S],
    ];
    if(note) rows2.push(['Ghi chu:',ra(note),28*S,168*S]);
    rows2.forEach(function(r){
      cx.font='bold '+(11*S)+'px Arial'; cx.fillStyle='#6b7280'; cx.fillText(r[0],r[2],r[3]);
      cx.font=(11*S)+'px Arial'; cx.fillStyle='#111'; cx.fillText(r[1],r[2]+68*S,r[3]);
    });

    // Table header
    var ty=180*S;
    cx.fillStyle='#1a56db'; cx.fillRect(18*S,ty,PW-36*S,30*S);
    cx.font='bold '+(12*S)+'px Arial'; cx.fillStyle='#fff'; cx.textAlign='center';
    cx.fillText('STT',60*S,ty+20*S);
    cx.fillText('MA VAN DON',310*S,ty+20*S);
    cx.fillText('GIO QUET',560*S,ty+20*S);
    cx.fillText('NGAY QUET',700*S,ty+20*S);

    // Rows
    rows.forEach(function(o,i){
      var ry=ty+30*S+i*ROW_H;
      cx.fillStyle=i%2===0?'#f0f5ff':'#fff';
      cx.fillRect(18*S,ry,PW-36*S,ROW_H);
      cx.strokeStyle='#e8e6df'; cx.lineWidth=0.5*S;
      cx.strokeRect(18*S,ry,PW-36*S,ROW_H);
      var idx=pg*rowsPerPage+i+1;
      cx.font=(11*S)+'px Arial'; cx.fillStyle='#6b7280'; cx.textAlign='center';
      cx.fillText(String(idx),60*S,ry+17*S);
      cx.font='bold '+(13*S)+'px "Courier New"'; cx.fillStyle='#1a56db';
      cx.fillText(o.code,310*S,ry+17*S);
      cx.font=(11*S)+'px Arial'; cx.fillStyle='#374151';
      cx.fillText(o.time,560*S,ry+17*S);
      cx.fillText(o.date,700*S,ry+17*S);
    });

    // Signature (last page only)
    if(pg===pages.length-1){
      var sy=ty+30*S+rows.length*ROW_H+28*S;
      cx.strokeStyle='#d1d5db'; cx.lineWidth=1*S;
      cx.strokeRect(28*S,sy,340*S,76*S);
      cx.strokeRect(PW-28*S-340*S,sy,340*S,76*S);
      cx.font='bold '+(12*S)+'px Arial'; cx.fillStyle='#374151'; cx.textAlign='center';
      cx.fillText('NGUOI GIAO',198*S,sy+18*S);
      cx.fillText('NGUOI NHAN',PW-28*S-170*S,sy+18*S);
      cx.font=(10*S)+'px Arial'; cx.fillStyle='#9b9890';
      cx.fillText('(Ky va ghi ro ho ten)',198*S,sy+34*S);
      cx.fillText('(Ky va ghi ro ho ten)',PW-28*S-170*S,sy+34*S);
      var staffClean=ra(staff);
      if(staffClean && staffClean!=='Chua nhap'){
        cx.font='bold '+(12*S)+'px Arial'; cx.fillStyle='#1a56db';
        cx.fillText(staffClean,198*S,sy+64*S);
      }
    }

    // Footer
    cx.font=(10*S)+'px Arial'; cx.fillStyle='#9b9890'; cx.textAlign='center';
    cx.fillText('Xuat: '+timeStr+' - '+dateStr+'  |  Phien: '+sessionId+'  |  Trang '+(pg+1)+'/'+totalPages, PW/2, cv.height-10*S);

    canvases.push(cv);
  }

  // Build PDF from canvases
  _canvasesToPDF(canvases, PW, function(blob){
    var fname='BienBan_BanGiao_'+ra(staff).replace(/\s+/g,'_')+'_'+dateStr.replace(/\//g,'-')+'.pdf';
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download=fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},10000);
    showToast('Da xuat: '+fname,'success');
  });
}

function _canvasesToPDF(canvases, canvasW, callback){
  var A4W=595.28;
  var sc=A4W/canvasW;
  var jpgs=canvases.map(function(cv){
    var c2=document.createElement('canvas');
    c2.width=cv.width; c2.height=cv.height;
    var x=c2.getContext('2d');
    x.fillStyle='#fff'; x.fillRect(0,0,c2.width,c2.height);
    x.drawImage(cv,0,0);
    var b64=c2.toDataURL('image/jpeg',0.90).split(',')[1];
    return {b64:b64, bin:atob(b64), w:cv.width, h:cv.height};
  });

  // Build minimal PDF
  var buf='%PDF-1.4\n';
  var offsets={};
  function obj(n,s){ offsets[n]=buf.length; buf+=n+' 0 obj\n'+s+'\nendobj\n'; }

  var nImg=jpgs.length;
  // obj ids: 1=catalog, 2=pages, 3..=page, 3+nImg..=img, 3+2*nImg..=content
  var pageBase=3, imgBase=3+nImg, csBase=3+2*nImg;

  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  var kids=[];
  for(var i=0;i<nImg;i++) kids.push((pageBase+i)+' 0 R');
  obj(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+nImg+' >>');

  for(var i=0;i<nImg;i++){
    var jd=jpgs[i];
    var pH=(jd.h*sc).toFixed(2);
    var pW2=A4W.toFixed(2);
    obj(pageBase+i,
      '<< /Type /Page /Parent 2 0 R\n'+
      '   /MediaBox [0 0 '+pW2+' '+pH+']\n'+
      '   /Resources << /XObject << /Im'+i+' '+(imgBase+i)+' 0 R >> >>\n'+
      '   /Contents '+(csBase+i)+' 0 R >>');
    offsets[imgBase+i]=buf.length;
    buf+=(imgBase+i)+' 0 obj\n'+
      '<< /Type /XObject /Subtype /Image\n'+
      '   /Width '+jd.w+' /Height '+jd.h+'\n'+
      '   /ColorSpace /DeviceRGB /BitsPerComponent 8\n'+
      '   /Filter /DCTDecode /Length '+jd.bin.length+'\n>>\nstream\n';
    buf+=jd.bin;
    buf+='\nendstream\nendobj\n';
    var cs='q\n'+pW2+' 0 0 '+pH+' 0 0 cm\n/Im'+i+' Do\nQ\n';
    obj(csBase+i,'<< /Length '+cs.length+' >>\nstream\n'+cs+'endstream');
  }

  var maxObj=csBase+nImg;
  var xref=buf.length;
  buf+='xref\n0 '+(maxObj+1)+'\n';
  buf+='0000000000 65535 f \n';
  for(var n=1;n<=maxObj;n++){
    buf+=(offsets[n]!==undefined?String(offsets[n]).padStart(10,'0'):'0000000000')+' 00000 n \n';
  }
  buf+='trailer\n<< /Size '+(maxObj+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';

  var bytes=new Uint8Array(buf.length);
  for(var bi=0;bi<buf.length;bi++) bytes[bi]=buf.charCodeAt(bi)&0xff;
  callback(new Blob([bytes],{type:'application/pdf'}));
}
</script>
